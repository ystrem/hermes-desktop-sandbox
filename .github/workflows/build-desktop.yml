name: Build & Release Hermes Desktop AppImage

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Check every 6 hours
  workflow_dispatch:        # Allow manual triggers
    inputs:
      force_build:
        description: 'Force build even if no new upstream release/commit is detected'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox repository
        uses: actions/checkout@v4

      - name: Check upstream NousResearch/hermes-agent commit & releases
        id: check_upstream
        run: |
          UPSTREAM_REPO="NousResearch/hermes-agent"
          SANDBOX_REPO="${{ github.repository }}"

          echo "Checking latest commit from https://github.com/${UPSTREAM_REPO}..."
          COMMIT_JSON=$(curl -sSH "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/commits/main")
          
          UPSTREAM_SHA=$(echo "${COMMIT_JSON}" | jq -r '.sha')
          COMMIT_MSG=$(echo "${COMMIT_JSON}" | jq -r '.commit.message')
          COMMIT_AUTHOR=$(echo "${COMMIT_JSON}" | jq -r '.commit.author.name')

          if [ -z "${UPSTREAM_SHA}" ] || [ "${UPSTREAM_SHA}" = "null" ]; then
            echo "Error fetching upstream commit SHA."
            exit 1
          fi

          SHORT_SHA="${UPSTREAM_SHA:0:7}"
          echo "Upstream latest main commit SHA: ${SHORT_SHA}"

          echo "Checking latest release in ${SANDBOX_REPO}..."
          LATEST_TAG=$(curl -sSH "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${SANDBOX_REPO}/releases/latest" | jq -r '.tag_name' 2>/dev/null || echo "")

          if [ "${LATEST_TAG}" = "null" ]; then
            LATEST_TAG=""
          fi

          echo "Current latest release tag in sandbox: ${LATEST_TAG:-none}"

          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          if [ "${FORCE_BUILD}" = "true" ] || [ "${LATEST_TAG}" != "v-${SHORT_SHA}" ]; then
            echo "New upstream release/commit detected or forced build requested!"
            echo "BUILD_NEEDED=true" >> $GITHUB_OUTPUT
            echo "NEW_TAG=v-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "COMMIT_SHA=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT
            echo "COMMIT_AUTHOR=${COMMIT_AUTHOR}" >> $GITHUB_OUTPUT
            echo "COMMIT_MSG<<EOF" >> $GITHUB_OUTPUT
            echo "${COMMIT_MSG}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "No new upstream commits. Release ${LATEST_TAG} is up to date."
            echo "BUILD_NEEDED=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone upstream Hermes Agent
        if: steps.check_upstream.outputs.BUILD_NEEDED == 'true'
        run: |
          git clone https://github.com/NousResearch/hermes-agent.git hermes-agent-repo
          cd hermes-agent-repo
          git checkout ${{ steps.check_upstream.outputs.COMMIT_SHA }}

      - name: Setup Node.js
        if: steps.check_upstream.outputs.BUILD_NEEDED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & build AppImage
        if: steps.check_upstream.outputs.BUILD_NEEDED == 'true'
        run: |
          cd hermes-agent-repo
          npm ci || npm install
          if [ -d "apps/desktop" ]; then
            cd apps/desktop
            npm ci || npm install
            npm run build 2>/dev/null || true
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --linux AppImage || CSC_IDENTITY_AUTO_DISCOVERY=false npm run pack -- --linux AppImage || npm run dist:linux
          fi

      - name: Locate built AppImage & compute checksum
        if: steps.check_upstream.outputs.BUILD_NEEDED == 'true'
        id: locate_appimage
        run: |
          APPIMAGE_PATH=$(find hermes-agent-repo -name "*.AppImage" -type f | head -n 1)
          if [ -z "${APPIMAGE_PATH}" ]; then
            echo "Error: AppImage not found! Listing files in hermes-agent-repo:"
            find hermes-agent-repo -maxdepth 4
            exit 1
          fi
          FULL_PATH="$(pwd)/${APPIMAGE_PATH#./}"
          FILE_NAME=$(basename "${FULL_PATH}")
          SHA256_HASH=$(sha256sum "${FULL_PATH}" | awk '{print $1}')
          
          HERMES_VERSION="v0.17.0"
          if [ -f "hermes-agent-repo/apps/desktop/package.json" ]; then
            PARSED_VER=$(jq -r '.version' hermes-agent-repo/apps/desktop/package.json 2>/dev/null || echo "")
            if [ -n "${PARSED_VER}" ] && [ "${PARSED_VER}" != "null" ]; then
              HERMES_VERSION="v${PARSED_VER}"
            fi
          fi

          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          echo "Found AppImage at: ${FULL_PATH}"
          echo "APPIMAGE_PATH=${FULL_PATH}" >> $GITHUB_OUTPUT
          echo "APPIMAGE_NAME=${FILE_NAME}" >> $GITHUB_OUTPUT
          echo "SHA256_HASH=${SHA256_HASH}" >> $GITHUB_OUTPUT
          echo "HERMES_VERSION=${HERMES_VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload AppImage
        if: steps.check_upstream.outputs.BUILD_NEEDED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_upstream.outputs.NEW_TAG }}
          name: "Hermes Desktop ${{ steps.locate_appimage.outputs.HERMES_VERSION }} (${{ steps.check_upstream.outputs.NEW_TAG }})"
          body: |
            ### ⚕️ Hermes Desktop Release (${{ steps.locate_appimage.outputs.HERMES_VERSION }})

            Automated build of Hermes Desktop from upstream [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent).

            #### 📝 Upstream Commit & Changes
            - **Commit**: [`${{ steps.check_upstream.outputs.COMMIT_SHA }}`](https://github.com/NousResearch/hermes-agent/commit/${{ steps.check_upstream.outputs.COMMIT_SHA }})
            - **Author**: `${{ steps.check_upstream.outputs.COMMIT_AUTHOR }}`
            - **Built at**: `${{ steps.locate_appimage.outputs.BUILD_DATE }}`

            ##### 💬 Commit Message & What's New:
            ```text
            ${{ steps.check_upstream.outputs.COMMIT_MSG }}
            ```

            #### 🔒 SHA256 Checksum
            ```text
            sha256:${{ steps.locate_appimage.outputs.SHA256_HASH }}  ${{ steps.locate_appimage.outputs.APPIMAGE_NAME }}
            ```
          files: ${{ steps.locate_appimage.outputs.APPIMAGE_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




